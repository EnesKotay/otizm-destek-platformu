# ── HTTP → HTTPS yönlendirme + Let's Encrypt ACME challenge ──────────────────
server {
    listen 80;
    server_name otizmdestek.com www.otizmdestek.com;

    # Certbot webroot challenge — SSL kurulumu ve yenilemesi için
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name otizmdestek.com www.otizmdestek.com;
    root /usr/share/nginx/html;
    index index.html;

    # Let's Encrypt sertifikaları (certbot volume'ünden gelir)
    ssl_certificate     /etc/letsencrypt/live/otizmdestek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otizmdestek.com/privkey.pem;

    # SSL sertleştirme
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Güvenlik başlıkları
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                             always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        image/svg+xml;
    gzip_min_length 1024;

    # SPA routing — tüm rotalar index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy → backend container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # WebSocket (STOMP/SockJS) proxy → backend container
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Aktüatör endpoint'i dışarıya kapatılıyor
    location /actuator {
        return 403;
    }

    # Hash'li build artifact'ları → uzun süreli cache
    location ~* \.(js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html hiç cache'lenmemeli (yeni deploy anında devreye girsin)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
