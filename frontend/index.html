    <!-- SEO / paylaşım —

         için bunları build sırasında rotaya özel değerlerle değiştirir. -->
    <title>Otizm Destek Platformu — Aileler ve uzmanlar için gelişim takibi</title>
    <meta
      name="description"
      content="Otizmli çocukların aileleri için güvenli gelişim takibi: günlük kayıt, acil durum kartı, BEP hazırlığı, kriz rehberi ve doğrulanmış uzmanlarla kontrollü paylaşım. Aile hesabı ücretsiz."
    />
    <link rel="canonical" href="https://otizmdestek.com/" />

    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://otizmdestek.com/" />
    <meta property="og:title" content="Otizm Destek Platformu — Aileler ve uzmanlar için gelişim takibi" />

      property="og:description"
