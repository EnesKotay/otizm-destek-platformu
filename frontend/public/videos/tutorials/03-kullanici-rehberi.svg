<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Kullanıcı Rehberini Kullanma video kapağı</title>
  <desc id="desc">Lacivert ve turkuaz zemin üzerinde oynat simgesi ve video başlığı</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#5eead4" stop-opacity=".52"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1150" cy="180" r="450" fill="url(#glow)"/>
  <circle cx="170" cy="770" r="390" fill="url(#glow)" opacity=".45"/>
  <g transform="translate(120 105)">
    <rect width="70" height="70" rx="20" fill="#0d9488"/>
    <text x="35" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="white">O</text>
    <text x="92" y="30" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="white">Otizm Destek</text>
    <text x="92" y="57" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#99f6e4">GELİŞİM PLATFORMU</text>
  </g>
  <g transform="translate(720 385)">
    <circle r="86" fill="white" fill-opacity=".16" stroke="white" stroke-opacity=".48" stroke-width="4"/>
    <circle r="65" fill="white"/>
    <path d="M-17-32 38 0-17 32Z" fill="#0d9488"/>
  </g>
  <text x="720" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="61" font-weight="900" fill="white">Kullanıcı Rehberini Kullanma</text>
  <text x="720" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#ccfbf1">Aradığınız özellik ve desteği hızla bulun</text>
</svg>
