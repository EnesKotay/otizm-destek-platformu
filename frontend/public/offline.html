<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Çevrimdışı — Otizm Destek</title>
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f8ff;
      color: #1e1b4b;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px;
      background: #eef2ff;
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; color: #1e1b4b; }
    p { font-size: 15px; color: #6b7280; line-height: 1.6; max-width: 320px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 28px;
      background: #4f46e5; color: #fff;
      border: none; border-radius: 14px;
      padding: 13px 24px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #4338ca; }
    .cached-notice {
      margin-top: 20px;
      font-size: 13px; color: #9ca3af;
    }
    .cached-notice strong { color: #6366f1; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>İnternet bağlantısı yok</h1>
  <p>Şu an çevrimdışısınız. Daha önce ziyaret ettiğiniz sayfalar önbellekten erişilebilir durumda.</p>
  <a href="/" class="btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    Ana Sayfaya Git
  </a>
  <p class="cached-notice">
    Bağlantı kurulduğunda <strong>verileriniz otomatik senkronize edilir.</strong>
  </p>
  <script>
    window.addEventListener('online', () => { window.location.reload(); });
  </script>
</body>
</html>
