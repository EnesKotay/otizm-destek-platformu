spring:
  application:
    name: autism-support-platform

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autism}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      connection-test-query: SELECT 1
      data-source-properties:
        prepareThreshold: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:14}
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER:false}
    repair-on-migrate: ${SPRING_FLYWAY_REPAIR_ON_MIGRATE:true}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent}

external:
  import:
    enabled: ${EXTERNAL_IMPORT_ENABLED:false}
    keywords: ${EXTERNAL_IMPORT_KEYWORDS:autism spectrum disorder,ABA therapy,autism parent support}

app:
  auth:
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}
    # Çapraz-site kurulumda (frontend vercel.app, backend onrender.com) refresh
    # çerezinin gönderilebilmesi için üretimde REFRESH_COOKIE_SECURE=true olmalı.
    # Aksi halde getSameSite() "Strict" döner, tarayıcı çerezi çapraz-site
    # /auth/refresh isteğinde göndermez ve reload sonrası 400 ile oturum düşer.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    # Bırakılırsa refresh-cookie-secure'a göre otomatik seçilir (true -> None,
    # false -> Strict). Çapraz-site için açıkça "None" verilebilir.
    cookie-same-site: ${COOKIE_SAME_SITE:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  upload:
    dir: ${APP_UPLOAD_DIR:${UPLOAD_DIR:uploads}}
  storage:
    type: ${STORAGE_TYPE:local}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  jwt:
    secret: ${JWT_SECRET:YXV0aXNtc3VwcG9ydHBsYXRmb3Jtc2VjcmV0a2V5Zm9ybG9jYWxkZXZlbG9wbWVudDEyMzQ1Njc4}
    access-token-expiration: ${JWT_ACCESS_EXP:900000}      # 15 minutes
    refresh-token-expiration: ${JWT_REFRESH_EXP:604800000} # 7 days
  encryption:
    secret-key: ${ENCRYPTION_KEY:autism-support-local-dev-encryption-key-32b}
    previous-keys: ${ENCRYPTION_PREVIOUS_KEYS:}
    backfill-enabled: ${ENCRYPTION_BACKFILL_ENABLED:true}
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@autism.com}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  rate-limit:
    redis-enabled: ${RATE_LIMIT_REDIS_ENABLED:true}
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
  turnstile:
    required: ${TURNSTILE_REQUIRED:false}
    secret-key: ${TURNSTILE_SECRET_KEY:}
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:admin@otizmdestek.com}
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
    service-account-json-base64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.autismsupport: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
