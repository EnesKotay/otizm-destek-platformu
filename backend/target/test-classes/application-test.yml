spring:
  datasource:
    url: jdbc:h2:mem:autism_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

app:
  jwt:
    secret: test-secret-key-for-junit-integration-tests-which-is-long-enough
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  encryption:
    secret-key: test-encryption-key
  cors:
    allowed-origins: http://localhost:5173
  rate-limit:
    redis-enabled: false

gemini:
  api:
    key: test
    url: http://localhost/gemini-disabled
